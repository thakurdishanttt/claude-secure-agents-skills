# Push a tag like v2026.11.18 to publish a GitHub Release with every skill zip,
# the all-skills pack and SHA256SUMS. Only tags on main are released.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate
        run: python3 scripts/validate_skills.py
      - name: Package
        run: python3 scripts/package.py --pack
      - name: Release notes
        run: |
          {
            echo "Skill versions in this release:"
            echo
            for f in skills/*/SKILL.md; do
              n="$(basename "$(dirname "$f")")"
              v="$(grep -m1 -E '^\s+version:' "$f" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
              echo "- \`$n\` $v"
            done
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS\`. Changes: see CHANGELOG.md."
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
