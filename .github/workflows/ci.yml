name: Validate and package skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate
        run: python3 scripts/validate_skills.py
      - name: References match the kit
        run: |
          python3 scripts/sync_from_kit.py
          if ! git diff --quiet -- skills; then
            echo "::warning::Skill references are behind the kit's standard; the weekly sync PR will update them."
            git checkout -- skills
          fi
      - name: Package
        run: python3 scripts/package.py --pack
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: |
            dist/*.zip
            dist/SHA256SUMS
