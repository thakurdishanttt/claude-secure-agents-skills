# Weekly: pull the latest security standard from claude-code-secure-agents into
# every skill's references/, bump the patch version of changed skills, and open
# a PR. A human reviews and merges it, then tags a release.
name: Sync standard from kit

on:
  schedule:
    - cron: "41 2 * * 1"     # Mondays 02:41 UTC (08:11 IST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sync
        run: |
          python3 scripts/sync_from_kit.py
          python3 scripts/validate_skills.py
      - name: Bump versions of changed skills and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed="$(git diff --name-only -- skills | cut -d/ -f2 | sort -u)"
          [ -n "$changed" ] || { echo "No changes."; exit 0; }
          for s in $changed; do
            python3 - "$s" <<'PY'
          import re, sys
          p = f"skills/{sys.argv[1]}/SKILL.md"; t = open(p).read()
          m = re.search(r'(\n\s+version:\s*")(\d+)\.(\d+)\.(\d+)(")', t)
          if m:
              t = t.replace(m.group(0), f'{m.group(1)}{m.group(2)}.{m.group(3)}.{int(m.group(4))+1}{m.group(5)}', 1)
              open(p, "w").write(t)
          PY
          done
          b="sync/kit-$(date -u +%Y%m%d)"
          git config user.name "skills-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$b"
          git add -A skills
          git commit -qm "Sync security standard from kit ($(cat skills/secure-code-review/references/KIT_VERSION.txt))"
          git push -q origin "$b"
          gh pr create --title "Sync standard from kit" --body "Updated skills: $(echo $changed | tr '\n' ' '). After merging, tag a release to publish new zips."
